name: tests

# Core gate: two Lab loads plus the retained gameplay and architecture suites.
# NOTE: written without being able to run it locally; if the Godot download URL for the pinned
# version changes, adjust GODOT_VERSION below.

on:
  push:
    branches: [main]
  pull_request:

env:
  GODOT_VERSION: "4.7-stable"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

      - name: Import project (build class cache)
        run: |
          set -o pipefail
          mkdir -p /tmp/borrowed_shapes_tests
          ~/godot/godot --headless --path . --import 2>&1 | tee /tmp/borrowed_shapes_tests/import.log
          if grep -E 'SCRIPT ERROR|ERROR:|WARNING:' /tmp/borrowed_shapes_tests/import.log; then
            exit 1
          fi

      - name: Run regression suites
        env:
          GODOT: /home/runner/godot/godot
        run: tools/run_tests.sh

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: /tmp/borrowed_shapes_tests
